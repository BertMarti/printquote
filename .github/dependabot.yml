# Actualizaciones semanales y agrupadas (un PR por ecosistema) para no llenar la lista de PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # @types/node sigue la línea del Node mínimo que soporta el proyecto (engines: >=22.12). Los tipos de un
      # Node más nuevo dejarían usar APIs que no existen en 22 sin que tsc avise. Se sube a la vez que engines.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7: typescript-eslint 8 exige typescript <6.1 y npm ci falla (PR #64 cerrada el 24/10/2026).
      # Quitar esta regla cuando typescript-eslint admita TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
